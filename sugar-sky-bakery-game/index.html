<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff5e9c"><title>Sugar Sky Bakery</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;font-family:system-ui;background:#fff4fa;color:#39263d}.l{text-align:center}.s{width:52px;height:52px;border:7px solid #ffd4e6;border-top-color:#ff5e9c;border-radius:50%;margin:auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div><h2>Opening Sugar Sky Bakery...</h2></div><script>(async()=>{const url='https://raw.githubusercontent.com/imisa2/openai/main/sugar-sky-bakery-game/part1.txt';const b=atob((await fetch(url)).text?await(await fetch(url)).text():''),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<main style="padding:2rem"><h1>Could not open the game</h1><p>Please refresh this page in a recent version of Chrome, Edge, Firefox or Safari.</p></main>');</script></body></html>
